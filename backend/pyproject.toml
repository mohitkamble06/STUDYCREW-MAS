[project]
name = "studycrew-backend"
version = "0.1.0"
description = "StudyCrew Multi-Agent Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.36",
    "alembic==1.13.3",
    "ollama==0.4.2",
    "crewai==0.103.0",
    "chromadb==0.5.9",
    "sentence-transformers==3.2.0",
    "pypdf==5.1.0",
    "httpx==0.27.2",
    "python-multipart==0.0.12",
    "email-validator==2.2.0",
    "sse-starlette==2.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.23.7",
    "pytest-mock==3.14.0",
    "ruff==0.6.9",
    "black==24.8.0",
    "mypy==1.13.0",
    "pre-commit==3.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008"]
fixable = ["ALL"]
unfixable = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/main.py"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"