services:
  - type: web
    name: studycrew-backend
    rootDir: backend
    env: python
    pythonVersion: 3.11
    buildCommand: pip install --upgrade pip --no-cache-dir && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Ensure build runs from backend directory
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-3-haiku-20240307
      - key: DATABASE_URL
        fromDatabase:
          name: studycrew-db
          property: connectionString
      - key: CHROMA_HOST
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: studycrew
      - key: FRONTEND_ORIGIN
        value: https://studycrew-frontend.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: studycrew-frontend
    rootDir: frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://studycrew-backend.onrender.com/api

databases:
  - name: studycrew-db
    databaseName: studycrew
    user: studycrew
    plan: free
    ipAllowList: []